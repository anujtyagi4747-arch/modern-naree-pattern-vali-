<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PATTERN वाली × MODERN नारी</title>

<style>

/* =========================
   BASIC RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#fffdf9;
    color:#222;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:9999;
    width:100%;
    background:rgba(255,255,255,.96);
    border-bottom:1px solid #eeeeee;
    backdrop-filter:blur(12px);
}

.navbar{
    max-width:1200px;
    height:72px;
    margin:auto;
    padding:0 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}


/* LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:5px;

    font-size:22px;
    font-weight:800;
    letter-spacing:-.7px;
    white-space:nowrap;
}

.logo .hindi{
    font-weight:500;
}


/* NAVIGATION */

.nav-links{
    display:flex;
    align-items:center;
    gap:28px;

    font-size:14px;
    font-weight:600;
}

.nav-links a{
    transition:.2s;
}

.nav-links a:hover{
    opacity:.5;
}


/* RIGHT ICONS */

.nav-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.icon-btn,
.menu-btn{
    border:0;
    background:transparent;

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

.menu-btn{
    display:none;
}


/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
    display:none;

    position:absolute;
    top:72px;
    left:0;

    width:100%;
    background:#fff;

    padding:20px;

    border-bottom:1px solid #eee;

    box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.mobile-menu.active{
    display:block;
}

.mobile-menu a{
    display:block;

    padding:15px 5px;

    border-bottom:1px solid #f0f0f0;

    font-size:15px;
    font-weight:600;
}


/* =========================
   HERO
========================= */

.hero{
    max-width:1200px;
    margin:20px auto 0;
    padding:0 20px;
}

.hero-box{
    min-height:550px;

    display:grid;
    grid-template-columns:1fr 1fr;

    overflow:hidden;

    border-radius:24px;

    background:
    linear-gradient(
        115deg,
        #f8dfd8 0%,
        #fff3e9 52%,
        #f3e5dc 100%
    );
}


/* HERO TEXT */

.hero-content{
    padding:65px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.hero-small{
    margin-bottom:18px;

    font-size:11px;
    font-weight:700;
    letter-spacing:2.5px;
    text-transform:uppercase;
}

.hero-title{
    margin-bottom:24px;

    font-size:clamp(46px,5.5vw,72px);
    line-height:.94;
    letter-spacing:-4px;

    font-weight:800;
}

.hero-title .light{
    font-weight:400;
}

.hero-description{
    max-width:440px;

    margin-bottom:30px;

    color:#606060;

    font-size:15px;
    line-height:1.8;
}

.hero-button{
    width:max-content;

    padding:15px 27px;

    border:0;
    border-radius:30px;

    background:#222;
    color:#fff;

    font-size:12px;
    font-weight:700;
    letter-spacing:.4px;

    transition:.25s;
}

.hero-button:hover{
    transform:translateY(-2px);
}


/* HERO IMAGE */

.hero-image{
    min-height:550px;

    background-image:
    url("https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=1000&q=85");

    background-size:cover;
    background-position:center;
}


/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .navbar{
        height:64px;
        padding:0 15px;
    }

    .logo{
        font-size:18px;
        letter-spacing:-.5px;
    }

    .nav-links{
        display:none;
    }

    .nav-actions{
        gap:2px;
    }

    .icon-btn{
        width:32px;
        height:32px;
        font-size:18px;
    }

    .menu-btn{
        display:flex;
        font-size:23px;
    }

    .mobile-menu{
        top:64px;
    }


    /* HERO */

    .hero{
        margin-top:12px;
        padding:0 12px;
    }

    .hero-box{
        min-height:auto;

        display:flex;
        flex-direction:column;

        border-radius:19px;
    }

    .hero-content{
        padding:42px 24px 38px;
    }

    .hero-small{
        margin-bottom:15px;
        font-size:9px;
        letter-spacing:2px;
    }

    .hero-title{
        margin-bottom:20px;

        font-size:45px;
        line-height:.96;
        letter-spacing:-2.8px;
    }

    .hero-description{
        margin-bottom:25px;

        font-size:14px;
        line-height:1.7;
    }

    .hero-button{
        padding:14px 23px;
        font-size:11px;
    }

    .hero-image{
        min-height:390px;
        width:100%;
    }
}


/* SMALL PHONES */

@media(max-width:380px){

    .logo{
        font-size:16px;
    }

    .hero-title{
        font-size:41px;
    }

    .hero-image{
        min-height:350px;
    }
}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <nav class="navbar">

        <!-- LOGO -->

        <a href="#home" class="logo">

            <span>PATTERN</span>

            <span class="hindi">वाली</span>

        </a>


        <!-- DESKTOP MENU -->

        <div class="nav-links">

            <a href="#home">Home</a>

            <a href="#shop">Shop</a>

            <a href="#collections">Collections</a>

            <a href="#about">About</a>

            <a href="#contact">Contact</a>

        </div>


        <!-- ACTIONS -->

        <div class="nav-actions">

            <button class="icon-btn">
                ⌕
            </button>

            <button class="icon-btn">
                ♡
            </button>

            <button class="icon-btn">
                🛍
            </button>

            <button
                class="menu-btn"
                onclick="toggleMenu()">
                ☰
            </button>

        </div>

    </nav>


    <!-- MOBILE MENU -->

    <div class="mobile-menu" id="mobileMenu">

        <a href="#home" onclick="closeMenu()">
            Home
        </a>

        <a href="#shop" onclick="closeMenu()">
            Shop
        </a>

        <a href="#collections" onclick="closeMenu()">
            Collections
        </a>

        <a href="#about" onclick="closeMenu()">
            About
        </a>

        <a href="#contact" onclick="closeMenu()">
            Contact
        </a>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main>


<!-- HERO -->

<section class="hero" id="home">

    <div class="hero-box">


        <!-- HERO CONTENT -->

        <div class="hero-content">

            <div class="hero-small">
                New Collection · 2026
            </div>


            <h1 class="hero-title">

                Simple.<br>

                <span class="light">
                    Bold.
                </span><br>

                Beautiful.

            </h1>


            <p class="hero-description">

                Discover effortless fashion made for
                the modern woman — elegant styles,
                beautiful details and timeless
                everyday pieces.

            </p>


            <button
                class="hero-button"
                onclick="goToShop()">

                SHOP COLLECTION →

            </button>

        </div>


        <!-- HERO IMAGE -->

        <div class="hero-image"></div>


    </div>

</section>


</main>



<script>

/* =========================
   MOBILE MENU
========================= */

function toggleMenu(){

    const menu =
        document.getElementById("mobileMenu");

    menu.classList.toggle("active");

}


function closeMenu(){

    const menu =
        document.getElementById("mobileMenu");

    menu.classList.remove("active");

}


/* =========================
   SHOP BUTTON
========================= */

function goToShop(){

    const shop =
        document.getElementById("shop");

    if(shop){

        shop.scrollIntoView({
            behavior:"smooth"
        });

    }

}

</script>

</body>
                         </html>
